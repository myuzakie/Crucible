name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contract fixtures
        run: |
          forge build --root examples/monad-erc20-demo
          forge build --root examples/monad-erc721-demo

      - name: Test ERC-721 example
        run: forge test --root examples/monad-erc721-demo

      - name: Test certificate registry
        run: forge test --root examples/monad-certificate-registry

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test certificate registry on fresh Anvil
        run: |
          anvil --silent > /tmp/crucible-anvil.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill $ANVIL_PID' EXIT
          sleep 2
          forge build --root examples/monad-certificate-registry
          pnpm test:registry:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
